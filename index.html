<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page" id="page" data-state="idle">
    <div class="art" id="art"><img id="art-img" alt="" hidden></div>
    <div class="time" id="time">00:30</div>
    <div class="btns">
      <button class="btn" id="main-btn" type="button">Start</button>
      <button class="btn" id="reset-btn" type="button">Reset</button>
      <button class="btn" id="restart-btn" type="button" hidden>Restart session</button>
    </div>
    <div class="info" id="info" hidden>
      <div class="t" id="info-title"></div>
      <div id="info-artist"></div>
      <div id="info-year"></div>
      <a id="info-link" target="_blank" rel="noopener">Read about this painting at the Met</a>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
